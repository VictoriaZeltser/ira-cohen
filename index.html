<!doctype html>
<html lang="ru" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ира Коэн · Тело говорит. Душа ведёт.</title>
<meta name="description" content="Интегративный подход: метод д-ра Надера Бутто и «Эйн а-Бдолах». Работа с первопричиной кризиса. Нетания и онлайн, русский и иврит." />
<meta property="og:title" content="Ира Коэн · Тело говорит. Душа ведёт. Всё — от корня." />
<meta property="og:description" content="Метод д-ра Надера Бутто + «Эйн а-Бдолах». Нетания и онлайн." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Frank+Ruhl+Libre:wght@500;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet" />
<style>
/* v3 · мягкий живой стиль: природные тона (docs/10), плавные «листы», блики, мягкое появление */
:root{
  --bg:#faf7f2;--ink:#2b2622;--muted:#6f665f;--line:#e8e1d8;--accent:#8a6d4b;--accent-2:#a8865f;--soft:#f1ebe3;
  --sun:#e6d8bb;--bokeh:#d4c2a2;--water:#a9c6bb;--leaf:#ece0c6;--eve:#3c3f42;
  --serif:'Cormorant Garamond',Georgia,serif;--r:24px;
  --shadow:0 14px 34px -16px rgba(110,84,52,.32),0 2px 6px -2px rgba(110,84,52,.08);
}
[lang=he]{--serif:'Frank Ruhl Libre',Georgia,serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Rubik,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.wrap{max-width:980px;margin:0 auto;padding:0 22px}
h1,h2,.logo,.menu a.item,.price b,blockquote{font-family:var(--serif)}
h1,h2{font-weight:600}[lang=he] h1,[lang=he] h2{font-weight:500}
h1{font-size:clamp(40px,10vw,66px);line-height:1.08;margin:0 0 16px;letter-spacing:-.01em}
h2{font-size:clamp(30px,6vw,44px);line-height:1.15;margin:0 0 30px;text-align:center}
h2::after{content:'';display:block;width:54px;height:2px;margin:14px auto 0;border-radius:2px;background:linear-gradient(90deg,transparent,var(--accent-2),transparent)}
h3{margin:0 0 6px;font-size:19px;font-weight:500}
.lead{font-size:clamp(18px,2.4vw,21px);color:var(--muted);max-width:680px}
.muted{color:var(--muted)}

/* Шапка */
header{position:fixed;inset:0 0 auto 0;z-index:5;transition:background .3s,box-shadow .3s}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:62px;gap:12px}
header.solid{background:rgba(250,247,242,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 1px 0 rgba(138,109,75,.12)}
.logo{font-size:23px;font-weight:600;text-decoration:none;color:var(--ink)}[lang=he] .logo{font-weight:500}
header:not(.solid) .logo{color:#fff;text-shadow:0 1px 12px rgba(60,45,30,.35)}
nav{display:flex;gap:10px;align-items:center}
/* Переключатель языка: оба языка видны, выбранный подсвечен */
.langs{display:flex;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.6);border:1px solid rgba(138,109,75,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.langs button{border:0;background:transparent;font:inherit;font-size:14px;line-height:1.2;padding:6px 12px;border-radius:999px;color:var(--accent);cursor:pointer;transition:background .2s,color .2s}
.langs button[aria-pressed=true]{background:var(--accent);color:#fff;font-weight:500}
header:not(.solid) .langs{background:rgba(40,30,24,.22);border-color:rgba(255,255,255,.55)}
header:not(.solid) .langs button{color:#fff}
header:not(.solid) .langs button[aria-pressed=true]{background:#fff;color:var(--accent)}
.burger{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;padding:0;color:var(--ink)}
.burger span{display:block;width:22px;height:1.8px;background:currentColor;margin:3px 0;border-radius:2px}
.burger span:nth-child(2){width:16px;justify-self:end}
header:not(.solid) .burger{color:#fff}

/* Первый экран: закат над морем, мягкая дымка, медленное «дыхание» фона, блики */
.hero{position:relative;min-height:100svh;display:flex;align-items:flex-end;padding:96px 0 64px;color:#fff;overflow:hidden;isolation:isolate}
.hero::before{content:'';position:absolute;inset:-4%;z-index:-2;background:url(img/hero.jpg) center 42%/cover;animation:breathe 26s ease-in-out infinite alternate}
.hero::after{content:'';position:absolute;inset:0;z-index:-1;background:
  radial-gradient(90% 55% at 50% 38%,rgba(96,72,50,.30),transparent 75%),
  linear-gradient(180deg,rgba(92,70,50,.30) 0%,rgba(110,84,60,.26) 40%,rgba(84,68,54,.50) 66%,rgba(54,45,40,.78) 100%)}
@keyframes breathe{from{transform:scale(1)}to{transform:scale(1.07) translateY(-1%)}}
/* Первый экран с фото Иры: фото сверху во всю ширину, низ мягко уходит в тёплый тёмный тон под текстом */
.hero.with-photo::before{inset:0;background:var(--hero-photo) center top/100% auto no-repeat #3a302b;transform-origin:50% 0;animation-name:breathe-soft;filter:brightness(1.12) contrast(.97) saturate(1.04)}
.hero.with-photo::after{background:linear-gradient(180deg,rgba(40,30,24,.38) 0,rgba(40,30,24,0) 90px,rgba(58,48,43,0) 62vw,rgba(58,48,43,.72) 96vw,#3a302b 122vw)}
@keyframes breathe-soft{from{transform:scale(1)}to{transform:scale(1.035)}}
.hero.with-photo .avatar{display:none}
@media(max-width:719px){.hero.with-photo{min-height:0;padding-top:86vw;padding-bottom:58px}
  .hero.with-photo::after{background:linear-gradient(180deg,rgba(40,30,24,.24) 0,rgba(40,30,24,0) 70px,rgba(58,48,43,0) 50vw,rgba(58,48,43,.86) 82vw,#3a302b 98vw)}}
/* широкий экран: фото сбоку, текст рядом на тёплом тёмном фоне */
@media(min-width:720px){.hero.with-photo{align-items:center}
  .hero.with-photo::before{background-size:auto 100%;background-position:right top}
  [dir=rtl] .hero.with-photo::before{background-position:left top}
  .hero.with-photo::after{background:linear-gradient(90deg,#3a302b 0%,#3a302b 36%,rgba(58,48,43,.6) 52%,rgba(58,48,43,0) 70%)}
  [dir=rtl] .hero.with-photo::after{background:linear-gradient(270deg,#3a302b 0%,#3a302b 36%,rgba(58,48,43,.6) 52%,rgba(58,48,43,0) 70%)}
  .hero.with-photo .wrap{max-width:1080px;width:100%}.hero.with-photo .wrap>*{max-width:480px}}
.bokeh{position:absolute;inset:0;z-index:-1;pointer-events:none}
.bokeh i{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,244,222,.55),rgba(255,244,222,0) 70%);animation:float 14s ease-in-out infinite alternate}
.bokeh i:nth-child(1){width:140px;height:140px;left:8%;top:52%;animation-duration:17s}
.bokeh i:nth-child(2){width:80px;height:80px;left:70%;top:60%;animation-duration:13s;animation-delay:-4s}
.bokeh i:nth-child(3){width:200px;height:200px;left:55%;top:30%;opacity:.6;animation-duration:21s}
.bokeh i:nth-child(4){width:60px;height:60px;left:25%;top:74%;animation-duration:11s;animation-delay:-2s}
.bokeh i:nth-child(5){width:110px;height:110px;left:84%;top:80%;animation-duration:19s;animation-delay:-7s}
@keyframes float{from{transform:translate(0,0)}to{transform:translate(18px,-26px)}}
.hero h1{text-shadow:0 2px 24px rgba(60,40,20,.45),0 1px 3px rgba(60,40,20,.25)}
.hero .lead,.hero .profile{text-shadow:0 1px 12px rgba(50,34,20,.5)}
.hero .lead{color:rgba(255,255,255,.96)}
.profile{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.avatar{width:74px;height:74px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--serif);font-size:32px;color:#fff;
  background:linear-gradient(140deg,rgba(255,255,255,.35),rgba(255,255,255,.08)) center/cover;border:1.5px solid rgba(255,255,255,.85);box-shadow:0 0 0 6px rgba(255,255,255,.14),0 8px 24px rgba(60,40,20,.25)}
/* с фото: аватар крупным планом на лице, в арке — целиком */
.avatar[style*=background-image]{background-size:220%;background-position:50% 6%}
.photo[style*=background-image]{background-size:cover;background-position:center 20%}
/* фото уже на первом экране — в «Об Ире» не повторяем */
.with-photo-page .about{grid-template-columns:1fr;max-width:720px;text-align:center}.with-photo-page .photo{display:none}
.with-photo-page .about h2{text-align:center}.with-photo-page .about h2::after,.with-photo-page .about blockquote::before{margin-inline:auto}
.profile b{display:block;font-size:19px;font-weight:500}.profile span{color:rgba(255,255,255,.88);font-size:15px}
.links{display:grid;gap:11px;max-width:540px;margin:28px 0 0}
.links a{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:20px;text-decoration:none;font-weight:500;color:var(--ink);
  background:rgba(255,253,249,.84);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 8px 26px -12px rgba(40,28,16,.45);transition:transform .25s,box-shadow .25s}
.links a:hover{transform:translateY(-2px);box-shadow:0 14px 30px -12px rgba(40,28,16,.5)}
.links a>span:not(.ic){flex:1}
.links a::after{content:'→';color:var(--accent);opacity:.7}[dir=rtl] .links a::after{content:'←'}
.links small{display:block;font-weight:400;font-size:13.5px;opacity:.72}
.links a.primary{color:#fff;background:linear-gradient(120deg,#86684a,#7a5f40 55%,#6b5236);animation:glow 3.6s ease-in-out infinite}
.links a.primary::after{color:#fff;opacity:.9}
@keyframes glow{0%,100%{box-shadow:0 8px 26px -10px rgba(138,109,75,.7),0 0 0 0 rgba(255,236,205,.0)}50%{box-shadow:0 10px 30px -10px rgba(138,109,75,.8),0 0 0 7px rgba(255,236,205,.18)}}
.ic{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;background:var(--soft);color:var(--accent)}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.primary .ic{background:rgba(255,255,255,.2);color:#fff}

/* Разделы — мягкие «листы», которые наплывают друг на друга */
main>section:not(.hero){position:relative;padding:76px 0 84px;margin-top:-34px;border-radius:34px 34px 0 0;scroll-margin-top:30px}
#who{background:radial-gradient(60% 40% at 100% 0%,rgba(230,216,187,.55),transparent 70%),radial-gradient(50% 35% at 0% 100%,rgba(169,198,187,.28),transparent 70%),var(--bg)}
#method{background:linear-gradient(180deg,#eef2ee 0%,#f3f1ea 100%)}
#how{background:radial-gradient(70% 45% at 0% 0%,rgba(236,224,198,.9),transparent 70%),#f8f3ea}
#prices{background:linear-gradient(180deg,#f3ece1 0%,#faf7f2 100%)}
#about{background:radial-gradient(55% 40% at 100% 20%,rgba(212,194,162,.4),transparent 70%),var(--bg)}
#faq{background:linear-gradient(180deg,#f1f4f1,#f6f3ec)}
#contact{overflow:hidden;isolation:isolate;color:#fff;background:linear-gradient(180deg,rgba(92,72,56,.84) 0%,rgba(78,62,50,.9) 45%,#3f3632 100%),url(img/hero.jpg) center 46%/cover;padding-bottom:110px}

/* Карточки */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.card{background:rgba(255,255,255,.78);border-radius:var(--r);padding:24px 22px;box-shadow:var(--shadow);backdrop-filter:blur(4px)}
.card .ic{width:48px;height:48px;margin-bottom:14px;background:linear-gradient(140deg,#f6efe3,#e9dcc4)}
.card .ic svg{width:24px;height:24px}
.card p{margin:0}
#method .card .ic{background:linear-gradient(140deg,#eaf2ee,#cfe0d8);color:#5f7d72}
.common{margin:30px auto 0;max-width:640px;text-align:center;font-family:var(--serif);font-size:clamp(21px,3.4vw,26px);line-height:1.4;color:var(--ink)}

/* Как проходит встреча — мягкая линия шагов */
.steps{counter-reset:s;list-style:none;padding:0;margin:0 auto;max-width:680px;position:relative}
.steps::before{content:'';position:absolute;inset-inline-start:21px;top:24px;bottom:24px;width:2px;background:linear-gradient(180deg,var(--sun),var(--water));border-radius:2px}
.steps li{counter-increment:s;position:relative;padding:4px 0 22px;padding-inline-start:64px}
.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:0;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--serif);font-size:21px;color:var(--accent);background:#fff;box-shadow:var(--shadow),inset 0 0 0 1.5px rgba(168,134,95,.35)}
.note{display:flex;gap:12px;align-items:flex-start;font-size:15px;color:var(--muted);background:rgba(255,255,255,.66);border-radius:18px;padding:15px 18px;margin:26px auto 0;max-width:680px;box-shadow:0 6px 18px -12px rgba(110,84,52,.3)}
.note::before{content:'';flex:none;width:8px;height:8px;margin-top:9px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 0 5px rgba(168,134,95,.15)}

/* Цены */
#price-list{display:grid;gap:14px;max-width:680px;margin:0 auto}
.price{position:relative;display:flex;justify-content:space-between;align-items:center;gap:16px;background:#fff;border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow)}
.price .muted{font-size:14px;margin-top:2px}
.price b{white-space:nowrap;font-size:30px;font-weight:600;color:var(--accent);line-height:1}
.price.first{background:linear-gradient(130deg,#fffaf2,#f4e8d4);box-shadow:var(--shadow),inset 0 0 0 1.5px rgba(168,134,95,.4);padding-top:30px}
.badge{position:absolute;top:-11px;inset-inline-start:20px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:500;padding:3px 12px;border-radius:999px;letter-spacing:.02em}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(120deg,#86684a,#7a5f40 55%,#6b5236);color:#fff;text-decoration:none;padding:14px 26px;border-radius:999px;font-weight:500;box-shadow:0 10px 24px -12px rgba(138,109,75,.8);transition:transform .25s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:rgba(255,255,255,.6);color:var(--accent);box-shadow:inset 0 0 0 1.5px rgba(138,109,75,.55)}

/* Обо мне */
.about{display:grid;grid-template-columns:240px 1fr;gap:40px;align-items:center}
.about h2{text-align:start}.about h2::after{margin-inline:0}
.photo{width:240px;height:300px;border-radius:999px 999px 28px 28px;display:grid;place-items:center;font-family:var(--serif);font-size:84px;color:#fff;
  background:radial-gradient(circle at 70% 25%,rgba(255,246,228,.9),transparent 40%),linear-gradient(170deg,#e6d8bb,#c4b196 55%,#9bb5ac) center/cover;box-shadow:var(--shadow);
  outline:1.5px solid rgba(168,134,95,.35);outline-offset:8px}
blockquote{position:relative;margin:26px 0 0;padding:6px 0 0;font-style:italic;font-size:clamp(22px,3.6vw,27px);line-height:1.35;color:var(--accent)}
[lang=he] blockquote{font-style:normal}
blockquote::before{content:'';display:block;width:34px;height:1.5px;margin-bottom:14px;background:var(--bokeh)}
.about blockquote::before{margin-inline:0}@media(max-width:720px){.about blockquote::before{margin-inline:auto}}

/* Вопросы */
#faq-list{max-width:720px;margin:0 auto}
details{background:rgba(255,255,255,.8);border-radius:20px;padding:0;margin-bottom:10px;box-shadow:0 6px 20px -14px rgba(110,84,52,.35);transition:background .25s}
details[open]{background:#fff}
summary{cursor:pointer;font-weight:500;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:14px;padding:17px 20px}
summary::-webkit-details-marker{display:none}
summary::after{content:'+';flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--accent);font-size:20px;font-weight:400;transition:transform .3s}
details[open] summary::after{transform:rotate(45deg)}
details p{margin:0;padding:0 20px 18px;color:var(--muted)}

/* Финал */
#contact h2,#contact .lead{text-align:center;color:#fff;margin-inline:auto}
#contact h2::after{background:linear-gradient(90deg,transparent,#e6d8bb,transparent)}
#contact .lead{color:rgba(255,255,255,.88)}
#contact .btn{background:#fff;color:var(--accent)}
#contact .btn.ghost{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.65)}
#contact .note{background:rgba(255,255,255,.1);color:rgba(255,255,255,.78);box-shadow:none}
#contact .note::before{background:#e6d8bb;box-shadow:0 0 0 5px rgba(230,216,187,.18)}
footer{padding:0 0 96px;font-size:14px;color:rgba(255,255,255,.7);background:#3f3632;text-align:center}
footer a{color:#e6d8bb}

/* Плавающая кнопка WhatsApp */
.wa{position:fixed;bottom:18px;inset-inline-end:18px;z-index:6;display:inline-flex;align-items:center;gap:8px;background:#2fbf71;color:#fff;border-radius:999px;padding:12px 18px;text-decoration:none;font-weight:500;
  box-shadow:0 10px 26px -10px rgba(20,90,50,.6);transition:opacity .3s,transform .3s}
.wa svg{width:20px;height:20px;fill:currentColor}
.wa.off{opacity:0;transform:translateY(12px);pointer-events:none}

/* Меню */
.menu{position:fixed;inset:0;z-index:20;color:#fff;display:flex;flex-direction:column;padding:22px 28px 34px;
  background:linear-gradient(180deg,rgba(58,66,64,.72),rgba(43,38,34,.9)),url(img/menu.jpg) center/cover;
  opacity:0;visibility:hidden;transform:translateY(-8px);transition:opacity .3s,transform .3s,visibility .3s}
.menu.open{opacity:1;visibility:visible;transform:none}
.menu .logo{color:#fff}
.menu .top{display:flex;justify-content:space-between;align-items:center;height:44px}
.menu .close{width:44px;height:44px;border:0;background:rgba(255,255,255,.12);border-radius:50%;color:#fff;font-size:26px;cursor:pointer;line-height:1}
.menu nav{display:flex;flex-direction:column;gap:4px;margin:auto 0;align-items:flex-start}
.menu a.item{color:#fff;text-decoration:none;font-size:clamp(30px,8vw,42px);font-weight:500;line-height:1.35;padding:2px 0;transition:color .2s,padding .2s}
.menu a.item:hover{color:#e9d9bf;padding-inline-start:6px}
.menu .bottom{display:grid;gap:10px}
.menu .bottom a{display:block;text-align:center;padding:15px;border-radius:999px;text-decoration:none;font-weight:500}
.menu .bottom .wa-btn{background:#2fbf71;color:#fff}.menu .bottom .ig-btn{border:1.5px solid rgba(255,255,255,.55);color:#fff}
body.noscroll{overflow:hidden}

/* Мягкое появление при прокрутке */
.js .rv{opacity:0;transform:translateY(22px);transition:opacity .8s ease,transform .8s ease}
.js .rv.in{opacity:1;transform:none}
.js .grid .rv:nth-child(2),.js .steps .rv:nth-child(2){transition-delay:.1s}
.js .grid .rv:nth-child(3),.js .steps .rv:nth-child(3){transition-delay:.2s}
.js .steps .rv:nth-child(4){transition-delay:.3s}

@media(max-width:720px){.about{grid-template-columns:1fr;justify-items:center;text-align:center}.about h2{text-align:center}.about h2::after{margin-inline:auto}
  .photo{width:220px;height:270px}main>section:not(.hero){padding:64px 0 76px}.price b{font-size:26px}}
@media(min-width:900px){.hero:not(.with-photo){align-items:center}.hero:not(.with-photo) .wrap{max-width:720px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.js .rv{opacity:1;transform:none}html{scroll-behavior:auto}}

/* ===== Доступность (ת"י 5568 / WCAG 2.0 AA) ===== */
:root{--accent-text:#6a5034}
a{color:var(--accent-text)}
.langs button,.btn.ghost{color:var(--accent-text)}
.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.skip{position:fixed;top:8px;inset-inline-start:8px;z-index:50;background:#fff;color:#1b1714;padding:12px 18px;border-radius:12px;font-weight:500;text-decoration:none;transform:translateY(-150%);transition:transform .2s;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.skip:focus{transform:none}
:focus-visible{outline:3px solid #0b57d0;outline-offset:3px;box-shadow:0 0 0 6px #fff}
.menu :focus-visible{outline-color:#fff;box-shadow:0 0 0 6px #0b57d0}
main:focus{outline:none}
/* читаемость шапки поверх фото */
header:not(.solid){background:linear-gradient(180deg,rgba(40,30,24,.55),rgba(40,30,24,0))}
